
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        thead {
            background-color: lightblue;
        }

        tbody {
            background-color: #f2f2f2;
        }

        tfoot {
            background-color: lightgreen;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Student Marks Table</h1>

    <table>
        <thead>
            <tr>
                <th>Roll No.</th>
                <th>Name</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>101</td>
                <td>Rahul</td>
                <td>80</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Aman</td>
                <td>90</td>
            </tr>

            <tr>
                <td>103</td>
                <td>Priya</td>
                <td>85</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="2">Total Marks</td>
                <td>255</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
